# Example loop-probe sweep config (YAML; .json also accepted).
#
#   python Generation/Loop-Probe/loop_probe_sweep.py --config Generation/Loop-Probe/sweep_config.example.yaml
#
# Every key here mirrors a CLI flag (dashes or underscores both work).
# Precedence: explicit CLI flag > this file > built-in default.

# ── What to run ────────────────────────────────────────────────────────────────
targets: [MMP2, MMP9, ADAM10, ADAM17]     # omit for all six

# Loops to design. ALL listed loops are designed simultaneously in every run.
# Underscore-joined tokens are swept JOINTLY (every length combination):
#   AB_C  -> AB x C length grid, capturing loop-loop interaction
#   EF    -> EF swept on its own, AB/C held native
loops: [AB, C, AB_C, EF]

# ── Loop length ranges ─────────────────────────────────────────────────────────
# [lo, hi] is an inclusive range; a longer list is an explicit set of lengths;
# "4-12" strings work too. Unlisted loops fall back to native-2 … native+4.
ranges:
  AB: [4, 11]
  C:  [4, 11]
  EF: [3, 8]

# ── Sampling volume / diversity ────────────────────────────────────────────────
n_backbones: 150          # RFd3 backbones per length configuration
seqs_per_backbone: 6      # LigandMPNN sequences per backbone (900 designs/config)
temperature: 0.6          # higher = more diverse loops; 0.3 is near-deterministic
seed: 42

# ── Template structures ────────────────────────────────────────────────────────
# Built-in sets: "alphafold" (AlphaFold_CIF, binder = chain A, 188 aa)
#                "haddock"   (HADDOCK_Outputs, binder = chain B, 121 aa)
# Chain order is auto-detected by sequence, so swapped files need no config.
template_set: alphafold

# Point at any other directory (filenames matched by target name if the set's
# pattern doesn't apply):
# template_dir: Data/TIMP_Complexes/HADDOCK_Outputs

# Or name a file per target explicitly (paths relative to the repo root):
# template_map:
#   MMP2:   Data/TIMP_Complexes/AlphaFold_CIF/fold_timp3_variant_wt_mmp2cd_model_0.cif
#   ADAM17: Data/TIMP_Complexes/AlphaFold_CIF/fold_timp3_variant_wt_adam17cd_model_0.cif

# Force chain ids only if auto-detection fails (it raises rather than guessing):
# binder_chain: A
# target_chain: B

# ── Construct ──────────────────────────────────────────────────────────────────
# TIMP3 construct length. Default 121 (N-terminal domain); auto-extends if GH
# is selected. Set 188 to keep full-length TIMP3.
# scaffold_len: 121

# ── Execution ──────────────────────────────────────────────────────────────────
# order: unit   # "unit" (default): run each unit across ALL targets before the
#               # next unit, in listed order — so with loops [AB, C, EF, AB_C],
#               # AB_C runs strictly last and you can grab AB/C/EF meanwhile.
#               # "target": finish one target completely before the next.
# fresh: false  # false (default) resumes: skip configs whose summary.json exists.

# ── Output ─────────────────────────────────────────────────────────────────────
# out_dir: Local/loop_probe/big_sweep_2026_07
# no_plots: false         # true = CSVs only; cross-sweep figures still drawn
