# Chai-1 conda env, exported from a working local WSL install (2026-09-05).
#
# Reproduce with:
#   conda env create -f Chai1Env.yml
#
# IMPORTANT — torch build / GPU compatibility:
#   `chai-lab` (pinned here at 0.6.1) itself only *declares* torch<2.7,>=2.3.1,
#   and `pip install chai-lab` alone will pull a torch 2.6.0+cu124 wheel — that
#   build has NO kernels for Blackwell GPUs (RTX 50-series, sm_120) and fails
#   at inference time with "CUDA error: no kernel image is available for
#   execution on the device" (confirmed locally on an RTX 5070 Ti). It works
#   fine on Ampere/Ada/Hopper cards (sm_80/86/89/90).
#
#   torch==2.7.1+cu128 below is a deliberate override past chai-lab's declared
#   ceiling — needed for Blackwell, and verified working end-to-end (real
#   designs, real pLDDT/pTM parsed) against chai-lab 0.6.1 despite the pin.
#   `conda env create` will pull it from PyPI by version string alone, which
#   does NOT host the +cu128 local build — you must install torch separately
#   first (before chai-lab, or reinstall after) via:
#       pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu128
#   If the cluster's GPUs are all pre-Blackwell (sm_90 or older), skip the
#   override entirely and just `pip install chai-lab` for torch 2.6.0+cu124 —
#   simpler and within chai-lab's declared support.
