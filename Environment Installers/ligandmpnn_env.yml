name: ligandmpnn
channels:
  - conda-forge
  - defaults

dependencies:
  # Python (dm-tree compatible)
  - python=3.10

  # Core scientific stack
  - numpy>=1.24.4,<2.0
  - scipy=1.12.0
  - networkx=3.2.1
  - mpmath=1.3.0
  - sympy>=1.13.3
  - typing_extensions=4.10.0
  - filelock=3.13.1
  - fsspec=2024.3.1
  - Jinja2=3.1.3
  - MarkupSafe=2.1.5
  - pyparsing=3.1.1
  - biopython=1.79

  # ML utils
  - ml-collections=0.1.1
  - dm-tree=0.1.8

  # Prebuilt ProDy
  - prody=2.4.1

  # PyTorch via pip (CUDA 12.8)
  - pip

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1
      - torchvision==0.22.1
      - torchaudio==2.7.1
      - setuptools==81.0.0

