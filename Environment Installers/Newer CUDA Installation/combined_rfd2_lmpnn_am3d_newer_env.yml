# Name: Combined RFdiffusion 2 + LigandMPNN + AllMetal3D (Newer CUDA)
# Purpose: Single environment for running all three tools with updated CUDA 12.8 stack.
name: combined_rfd2_lmpnn_am3d_newer_env
channels:
  - nvidia/label/cuda-12.8.0
  - https://conda.rosettacommons.org
  - dglteam/label/th24_cu124
  - conda-forge
  - defaults
dependencies:
  # Base Python (3.11 for better performance, supported by RFd2/LMPNN)
  - python=3.11
  - cuda-toolkit
  - pip
  
  # Core Scientific Stack
  - numpy<2
  - scipy
  - matplotlib
  - pandas
  - networkx
  - biopython
  
  # Tool Specific - RFdiffusion 2
  - jupyterlab
  - conda-forge::openbabel=3.1.1
  - dgl
  - pyrosetta
  
  # Pip packages - Handling Torch & Others
  - pip:
      # PyTorch / CUDA 12.8
      - --index-url https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
      - torchaudio
      
      # LigandMPNN
      - ml-collections
      - dm-tree
      - ProDy
      - pyparsing
      
      # RFdiffusion 2 Dependencies
      - hydra-core
      - omegaconf
      - e3nn
      - icecream
      
      # RFd2 requirements_cuda124.txt replacements (using standard pip)
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      
      # AllMetal3D
      - allmetal3d
      
      # Helper libs
      - tqdm
      - ipykernel
