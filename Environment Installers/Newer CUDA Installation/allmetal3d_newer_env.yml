# Name: AllMetal3D (Newer CUDA)
# GitHub: https://github.com/lcbc-epfl/allmetal3d
name: allmetal3d_newer_env
channels:
  - nvidia/label/cuda-12.8.0
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - cuda-toolkit
  - pip
  - pip:
    - --index-url https://download.pytorch.org/whl/cu128
    - torch==2.7.0+cu128
    - torchvision==0.22.0+cu128
    - torchaudio==2.7.0+cu128
    - allmetal3d --no-deps
    - requests
    - "huggingface_hub<1.0"
