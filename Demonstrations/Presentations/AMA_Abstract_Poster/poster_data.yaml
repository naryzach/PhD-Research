title: "Generative Deep Learning Pipeline for the Rapid Design of Patient-Specific Therapeutic Binders Against Customized Cancer Markers"
author: "Ryan Gustafson | University of Nevada, Reno"

background:
  title: "Background: The MMP Selectivity Problem"
  content: "Matrix Metalloproteinases (MMPs) are zinc-dependent endopeptidases essential to extracellular matrix remodeling [1]. In cancer, MMP9 is the primary driver of basement membrane degradation, enabling tumor cell intravasation and metastatic spread; it additionally promotes angiogenesis by cleaving and releasing VEGF sequestered in the ECM [3]. The clinically relevant distinction: MMP2 maintains basal connective tissue homeostasis, while MMP9 is the pathogenic species in >90% of invasive breast, colorectal, and lung cancers. Despite this, MMP2 and MMP9 share near-identical active site architecture (~65% identity in the catalytic domain), making selective inhibition extraordinarily difficult. Previous broad-spectrum MMP inhibitors (marimastat, batimastat) failed Phase III oncology trials due to musculoskeletal toxicity caused by off-target inhibition of MMP1/2/3 [3]. TIMP3 is a natural, endogenous inhibitor that engages metalloproteinase active sites through its N-terminal reactive site loops—offering a structurally validated scaffold for engineering selectivity by loop redesign [2]."
  figure: "../../SharedAssets/figures/De_Novo_Binder_Generation/mmp2_active_site.png"
  figure_caption: "Figure 1: MMP-2 catalytic domain (AlphaFold3 structure). Yellow sticks indicate the conserved zinc-binding HExxHxxGxxH motif shared between MMP2 and MMP9. Despite near-identical active site geometry, small loop architecture differences make selective binding achievable by short engineered peptide insertions."

methods:
  title: "Methods: AI-Driven 6-Stage Design Pipeline"
  content: "The workflow moves from generative structural AI through experimental validation in six tightly coupled stages. (1) A diffusion model generates novel 3D loop backbone geometries on the TIMP3 scaffold across the AB, C, and EF binding loops (6–24 aa expansions) [5], run on an A30 GPU (~20 hr/run). (2) A graph neural network sequences each backbone—sampling 1,000 diverse amino acid sequences per loop/target combination at low temperature (T=0.2) to preserve backbone compatibility while maximizing sequence diversity [6]. The scaffold residues are held fixed; only loop positions are designed. (3) The top 10 sequences per loop are co-folded with each metalloproteinase target using the AlphaFold3 Server; interface confidence metrics (ipTM, pLDDT, Interface PAE) are extracted per complex [4]. (4) A self-normalized T-score filter identifies variants that outperform their own cross-target mean—explicitly selecting for target-preferential binders rather than globally high-confidence structures. Candidates require T>2.0 on ≥2 independent metrics and ipTM ≥ 0.82. (5) All 13 final construct DNA sequences are screened for restriction enzyme recognition sites (BsrGI, BamHI, BsaI) that would interfere with Golden Gate cloning; all 13 passed. (6) Constructs are cloned into a yeast surface display vector, transformed into EBY100 yeast, and screened by flow cytometry. Binding Efficiency (DP/FITC+ fraction) is used as the primary cross-target-comparable metric."
  pipeline_figure: "../../SharedAssets/figures/De_Novo_Binder_Generation/fig_pipeline.png"

results:
  title: "Results"
  pipeline_success: "Computational Stage Outcomes: The diffusion backbone generator produced structurally diverse loop geometries in the 6–15 residue range not achievable by conventional mutagenesis, including extended beta-hairpin and helix-turn motifs [5]. Following sequence design and structural co-folding, the self-normalized T-score filter reduced the candidate pool from >1,000 generated sequences to 13 final constructs—a >98% reduction—while enriching for the experimentally confirmed MMP9 binders. Top-ranked MMP9 candidates (C-loop and AB-loop variants) achieved interface confidence scores placing them in the top decile of all evaluated structures, consistent with their subsequent experimental validation."
  content: "Experimental Validation (MMP9 vs MMP2): One-way ANOVA on Binding Efficiency (DP/FITC+) with Tukey-HSD post-hoc testing confirmed statistically significant MMP9 preference over MMP2 for all three MMP9-targeted constructs. C 12 (loop: ASGPITVNGETIW, C-loop) achieved 91.3% MMP9 vs 32.1% MMP2 binding efficiency (ANOVA p=0.012, Tukey MMP9-vs-MMP2 p=0.015). C 15 (C-loop) achieved 88.6% MMP9 vs 33.8% MMP2 (ANOVA p=0.018, Tukey p=0.043). AB 6 (loop: TDTFPTANWTGEV, AB-loop) showed the strongest statistical signal: 89.9% MMP9 vs 23.8% MMP2 (ANOVA p=0.0002, Tukey p=0.0004). Variants computationally predicted as 'High' (AB 2, AB 3) or 'Low' (C 13, AB 5) binders showed non-significant ANOVA (p>0.05), confirming that significant results in the selective constructs reflect genuine target discrimination rather than assay noise."
  figures:
    - path: "../../SharedAssets/figures/De_Novo_Binder_Generation/fig_mmp9_vs_mmp2.png"
      caption: "Figure 3: MMP9 vs MMP2 Binding Efficiency (mean ± 95% CI). Brackets indicate significant Tukey-HSD pairs (*p<0.05, **p<0.01, ***p<0.001). n.s. constructs were non-significant — validating design intent."
    - path: "../../SharedAssets/figures/De_Novo_Binder_Generation/fig_binding_heatmap.png"
      caption: "Figure 4: Binding Efficiency Heatmap across all 13 constructs × targets. * = ANOVA p<0.05. ADAM17 data included for within-target comparison only (no cross-target ADAM selectivity without ADAM10 control)."

